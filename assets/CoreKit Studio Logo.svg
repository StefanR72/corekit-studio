<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CoreKit Studio Logo</title>
  <desc id="desc">Rounded square CoreKit Studio logo with CK monogram and modular app blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="64" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DD6C6"/>
      <stop offset="0.52" stop-color="#46B7EE"/>
      <stop offset="1" stop-color="#3868D8"/>
    </linearGradient>
    <linearGradient id="shine" x1="94" y1="65" x2="339" y2="353" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="44" y="46" width="424" height="430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#172026" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="384" height="384" rx="94" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="82" y="82" width="348" height="348" rx="78" fill="url(#shine)"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="28">
    <path d="M238 176c-20-24-54-32-84-18-38 18-54 63-36 101 18 38 63 54 101 36"/>
    <path d="M286 164v184"/>
    <path d="M286 257l94-93"/>
    <path d="M300 260l86 90"/>
  </g>

  <g fill="#FFFFFF" opacity="0.94">
    <rect x="145" y="337" width="50" height="50" rx="15"/>
    <rect x="219" y="337" width="50" height="50" rx="15" opacity="0.86"/>
    <rect x="293" y="337" width="50" height="50" rx="15" opacity="0.72"/>
  </g>
</svg>
